<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Linguarium - universal language learning">
  <!--
    Full-bleed square variant of the mark (no rounded corners, no
    transparency): the source for the maskable icon and the
    apple-touch-icon, where the host platform applies its own masking.
    The artwork is scaled to 0.94 so it stays inside the maskable safe
    zone (a centered circle of diameter 80%).
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17a08f"/>
      <stop offset="0.55" stop-color="#0f766e"/>
      <stop offset="1" stop-color="#0a5a52"/>
    </linearGradient>
    <linearGradient id="pageL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe7e2"/>
    </linearGradient>
    <linearGradient id="pageR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#cfe7e2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" fill="url(#bg)"/>

  <g transform="translate(256 256) scale(0.94) translate(-256 -256)">
    <rect x="288" y="86" width="144" height="102" rx="30" fill="#ffffff"/>
    <path d="M326 184 L300 224 L368 186 Z" fill="#ffffff"/>
    <circle cx="324" cy="137" r="11" fill="#0f766e"/>
    <circle cx="360" cy="137" r="11" fill="#0f766e"/>
    <circle cx="396" cy="137" r="11" fill="#0f766e"/>

    <path d="M256 250 C 218 224 154 214 112 220 L 112 336 C 154 330 218 340 256 366 Z" fill="url(#pageL)"/>
    <path d="M256 250 C 294 224 358 214 400 220 L 400 336 C 358 330 294 340 256 366 Z" fill="url(#pageR)"/>
    <path d="M256 250 L 256 366" stroke="rgba(10,90,82,0.30)" stroke-width="5" stroke-linecap="round"/>

    <g fill="rgba(15,118,110,0.32)">
      <rect x="134" y="258" width="100" height="13" rx="6.5"/>
      <rect x="134" y="283" width="84" height="13" rx="6.5"/>
      <rect x="134" y="308" width="62" height="13" rx="6.5"/>
      <rect x="278" y="258" width="100" height="13" rx="6.5"/>
      <rect x="294" y="283" width="84" height="13" rx="6.5"/>
      <rect x="316" y="308" width="62" height="13" rx="6.5"/>
    </g>
  </g>
</svg>
