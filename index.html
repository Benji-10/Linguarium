<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linguarium - universal language learning</title>
  <meta name="description" content="A free, language-agnostic learning platform: natural reading, active practice and FSRS spaced repetition with one shared knowledge state.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#0f766e">
  <!-- Hides the "powered by Netlify" badge iframe immediately, before any
       stylesheet loads. Netlify injects #nl-badge-frame only when the site
       badge is enabled (Site configuration -> Domain management -> badge);
       this style plus src/core/theme.mjs make sure it never shows. -->
  <style>#nl-badge-frame,#netlify-badge,.netlify-badge-frame{display:none!important}</style>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/app.css">
  <script type="module" src="/app.js" defer></script>
</head>
<body>
  <div id="app"></div>
  <noscript>
    <p style="max-width:520px;margin:80px auto;font-family:Georgia,serif;">
      Linguarium is a JavaScript application: it needs scripts enabled to run.
      Everything runs locally in your browser against your own database.
    </p>
  </noscript>
</body>
</html>
