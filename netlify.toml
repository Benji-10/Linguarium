# Linguarium - Netlify configuration
# Static app is built into dist/ and served from there.
# All privileged operations (database, auth, AI) live in Netlify Functions.

[build]
  command = "npm run build"
  publish = "dist"

# Node 22 is required: @neondatabase/serverless needs >= 19 and the build tooling
# assumes a modern Node (the `v` regex flag, etc.). Netlify picks this up from
# netlify.toml AND the committed .nvmrc; do NOT change either back to 18.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:ui"
  targetPort = 3000
  framework = "#custom"
  autoLaunch = true

# Environment variables that MUST be configured (in the Netlify UI, never committed):
#   DATABASE_URL    - Neon PostgreSQL connection string (pooled endpoint recommended)
#   GEMINI_API_KEY  - optional. Without it every core feature still works; AI enrichment is disabled.
#   GEMINI_DAILY_LIMIT - optional per-user daily enrichment quota (default 300).
