# Linguarium - Netlify configuration
# Static app is built into dist/ and served from there.
# All privileged operations (database, auth, AI) live in Netlify Functions.

[build]
  # The app builds into dist/, then the database syncs itself: scripts/db-auto.mjs
  # applies sql/schema.sql + sql/seed.sql whenever their contents changed (a
  # content hash is stored in knowledge.db_state; unchanged SQL is a no-op).
  # It skips silently when DATABASE_URL is not set and NEVER fails a deploy
  # because of a database hiccup (warnings land in the build log instead).
  command = "npm run build && node scripts/db-auto.mjs"
  publish = "dist"

# Node 22 is required: @neondatabase/serverless needs >= 19 and the build tooling
# assumes a modern Node (the `v` regex flag, etc.). Netlify picks this up from
# netlify.toml AND the committed .nvmrc; do NOT change either back to 18.
[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# The app calls the API at /api/* (same-origin, credentials ride along).
# Netlify Dev proxies /api/* automatically, but PRODUCTION does not: without
# this redirect every API call would 404 on a deployed site.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[dev]
  command = "npm run dev:ui"
  targetPort = 3000
  framework = "#custom"
  autoLaunch = true

# Environment variables that MUST be configured (in the Netlify UI, never committed):
#   DATABASE_URL    - Neon PostgreSQL connection string (pooled endpoint recommended)
#   GEMINI_API_KEY  - optional. Without it every core feature still works; AI enrichment,
#                     text adaptation and AI generation are disabled.
#   GEMINI_DAILY_LIMIT         - optional per-user daily enrichment quota (default 300).
#   GEMINI_GENERATE_DAILY_LIMIT - optional per-user daily AI text generation quota (default 40).
#   LOOKUP_DAILY_LIMIT         - optional per-user daily online dictionary lookup quota
#                                (Wiktionary / dictionaryapi.dev; default 500).
# Dictionary lookups (Wiktionary REST + dictionaryapi.dev for English) and the
# import sources (Gutendex, MediaWiki APIs, curated news RSS) are keyless and
# free; no extra environment variables are needed for them.
